# AlfathPulsa — pakai PostgreSQL container yang sudah ada (CasaOS / Dockge)
#
# PostgreSQL ada di container: alfathpulsaapp-db-1
# Network Docker:              alfathpulsaapp_default
#
# ── Cara pakai di Dockge ─────────────────────────────────────────────────────
# 1. Paste isi file ini ke Dockge
# 2. Pastikan container postgres (alfathpulsaapp-db-1) sudah jalan
# 3. Deploy → buka http://<ip-stb>:8090
# 4. Login: admin / admin123 — langsung ganti password!
#
# ── Setelah pertama kali berhasil jalan ──────────────────────────────────────
# Ubah MIGRATE dari "true" ke "false" agar restart lebih cepat.
# (Schema sudah ada, tidak perlu push ulang setiap restart)
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    image: ghcr.io/adilacell011-cell/aplikasi-rekap:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgres://alfath:alfath@alfathpulsaapp-db-1:5432/alfathpulsa
      AUTH_SECRET: 61c2599ba8bedc27c82b3284be5d037aa760299b44dbf43b17ba337ce0cac56f
      FONNTE_API_KEY: ""
      LOG_LEVEL: warn
      NODE_MAX_OLD_SPACE_MB: "192"
      # "true" = buat tabel di DB (wajib pertama kali!)
      # Ganti ke "false" setelah berhasil deploy pertama kali.
      MIGRATE: "true"
    ports:
      - "8090:8080"
    volumes:
      - alfath_data:/data
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "1.0"
    networks:
      - alfathpulsaapp_default
      - default

volumes:
  alfath_data:

networks:
  alfathpulsaapp_default:
    external: true
