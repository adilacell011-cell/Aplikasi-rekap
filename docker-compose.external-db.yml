# AlfathPulsa — pakai PostgreSQL yang SUDAH ADA
# Untuk server dengan container alfathpulsaapp-db-1

services:
  app:
    image: ghcr.io/adilacell011-cell/aplikasi-rekap:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://alfath:alfath@alfathpulsaapp-db-1:5432/alfathpulsa
      AUTH_SECRET: GANTI_DENGAN_HASIL_openssl_rand_-hex_32
      FONNTE_API_KEY: ""
    ports:
      - "8090:8080"
    networks:
      - alfathpulsaapp_default
      - default

networks:
  alfathpulsaapp_default:
    external: true
