kind = "web"
previewPath = "/"
title = "AlfathPulsa"
version = "1.0.0"
id = "artifacts/alfathpulsa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19878

[services.development]
run = "pnpm --filter @workspace/alfathpulsa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alfathpulsa", "run", "build" ]
publicDir = "artifacts/alfathpulsa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19878"
BASE_PATH = "/"
